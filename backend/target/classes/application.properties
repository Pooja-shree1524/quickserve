# ── Server ──
server.port=9090

# ── MySQL / Spring Data JPA ──
spring.datasource.url=jdbc:mysql://localhost:3306/quickserve?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pooja15@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" auto-creates/updates tables from the entities below — fine for
# coursework. Switch to "validate" once your schema is stable, and use
# Flyway/Liquibase migrations for anything beyond a student project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Swagger / OpenAPI ──
# UI available at http://localhost:8080/swagger-ui.html
# Raw spec at     http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── Member 2's FastAPI AI Prediction Module ──
# Set ai.service.enabled=true once Member 2's service is up and its
# contract is confirmed. Until then, this module quietly uses its own
# local prep-time estimate (see QueueAlgorithmService / AiPredictionClient).
ai.service.enabled=false
ai.service.base-url=http://localhost:8001
